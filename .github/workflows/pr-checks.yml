name: Pull Request Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  pr-title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            build
          requireScope: false

  pr-description-check:
    name: Validate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR description is provided
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request ? context.payload.pull_request.body : '';
            if (!body || body.trim().length < 10) {
              core.setFailed('PR description is empty or too short. Please provide a clear description of your changes.');
            }

  build-and-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn clean test

      - name: Verify Package Compiles & Build Jar
        run: mvn package -DskipTests

      - name: Upload PR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDonutSmp-PR-${{ github.event.pull_request.number || 'manual' }}-JDK${{ matrix.java }}
          path: target/UltimateDonutSmp-*.jar
          retention-days: 7
          if-no-files-found: error

  dependency-review:
    name: Dependency Review Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4


