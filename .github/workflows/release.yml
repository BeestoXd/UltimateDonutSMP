name: Release & Auto Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Generate Release Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update changelog.md
        run: |
          DATE=$(date +'%Y-%m-%d')
          TAG="${{ github.ref_name }}"
          
          # Create new section content
          echo "## [$TAG] - $DATE" > new_entry.txt
          echo "" >> new_entry.txt
          echo "${{ steps.changelog.outputs.changelog }}" >> new_entry.txt
          echo "" >> new_entry.txt
          
          # Insert into changelog.md after top header
          head -n 4 changelog.md > updated_changelog.md
          cat new_entry.txt >> updated_changelog.md
          tail -n +5 changelog.md >> updated_changelog.md
          mv updated_changelog.md changelog.md
          rm new_entry.txt

      - name: Commit & Push Updated changelog.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "docs(changelog): auto-update changelog for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Failed to push changelog update"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UltimateDonutSMP ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: target/UltimateDonutSmp-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
