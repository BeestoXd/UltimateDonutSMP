name: Generate Changelog Only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag/name for the changelog (e.g. 1.5-pre or 1.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Date
        id: version_info
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            INPUT_VER="${{ github.event.inputs.version_name }}"
          else
            INPUT_VER="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' if present (e.g. v1.5-pre -> 1.5-pre)
          VERSION="${INPUT_VER#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build Changelog Content (Action)
        id: build_changelog
        continue-on-error: true
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationJson: |
            {
              "template": "## [${{ steps.version_info.outputs.version }}] - ${{ steps.version_info.outputs.date }}\n\n$CHANGELOG\n"
            }

      - name: Update changelog.md File
        env:
          ACTION_CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
          VERSION: ${{ steps.version_info.outputs.version }}
          RELEASE_DATE: ${{ steps.version_info.outputs.date }}
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess

          version = os.environ.get("VERSION", "1.0")
          date = os.environ.get("RELEASE_DATE", "")
          action_changelog = os.environ.get("ACTION_CHANGELOG", "").strip()

          print(f"DEBUG: Version={version}, Date={date}, ActionChangelogLen={len(action_changelog)}")

          changelog_body = action_changelog

          if not changelog_body:
              print("Action changelog empty. Fetching git log...")
              try:
                  prev_tag_cmd = subprocess.run(["git", "describe", "--tags", "--abbrev=0", "HEAD^"], capture_output=True, text=True)
                  prev_tag = prev_tag_cmd.stdout.strip()
                  if prev_tag:
                      log_cmd = subprocess.run(["git", "log", "--pretty=format:* %s (%h)", f"{prev_tag}..HEAD"], capture_output=True, text=True)
                  else:
                      log_cmd = subprocess.run(["git", "log", "--pretty=format:* %s (%h)", "-n", "15"], capture_output=True, text=True)
                  
                  commits = [line for line in log_cmd.stdout.splitlines() if "docs(changelog)" not in line and line.strip()]
                  if commits:
                      changelog_body = f"## [{version}] - {date}\n\n" + "\n".join(commits)
              except Exception as e:
                  print(f"Git log error: {e}")

          if not changelog_body:
              print("No changelog content generated. Exiting.")
              sys.exit(0)

          target_file = "changelog.md"
          if not os.path.exists(target_file) and os.path.exists("CHANGELOG.md"):
              target_file = "CHANGELOG.md"

          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              header = "".join(lines[:4])
              rest = "".join(lines[4:])
          else:
              header = "# Changelog - UltimateDonutSmp\n\nAll notable changes and behavioral modifications for the UltimateDonutSmp plugin.\n\n"
              rest = ""

          new_content = f"{header.strip()}\n\n{changelog_body.strip()}\n\n{rest.strip()}\n"

          with open(target_file, "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Successfully updated {target_file} for version {version}!")
          EOF

      - name: Commit and Push Updated changelog.md to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md CHANGELOG.md 2>/dev/null || true
          
          git status
          
          if git diff --staged --quiet; then
            echo "::warning ::No changes in changelog file to commit."
          else
            git commit -m "docs(changelog): update changelog for version ${{ steps.version_info.outputs.version }}"
            git push origin HEAD:main
            echo "Successfully pushed updated changelog to main branch!"
          fi
