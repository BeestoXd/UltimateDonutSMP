name: Generate Changelog Only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag/name for the changelog (e.g. 1.5-pre or 1.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Date
        id: version_info
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            INPUT_VER="${{ github.event.inputs.version_name }}"
          else
            INPUT_VER="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' if present (e.g. v1.5-pre -> 1.5-pre)
          VERSION="${INPUT_VER#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build Changelog Content
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationJson: |
            {
              "template": "## [${{ steps.version_info.outputs.version }}] - ${{ steps.version_info.outputs.date }}\n\n$CHANGELOG\n"
            }

      - name: Update changelog.md File
        env:
          CHANGELOG_BODY: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          if [ -z "$CHANGELOG_BODY" ]; then
            echo "No new changelog generated."
            exit 0
          fi

          # Target file fallback check (changelog.md or CHANGELOG.md)
          TARGET_FILE="changelog.md"
          if [ ! -f "$TARGET_FILE" ] && [ -f "CHANGELOG.md" ]; then
            TARGET_FILE="CHANGELOG.md"
          fi

          # Auto-create file with default header if missing
          if [ ! -f "$TARGET_FILE" ]; then
            echo "File $TARGET_FILE not found. Creating new file with default header."
            printf "# Changelog - UltimateDonutSmp\n\nAll notable changes and behavioral modifications for the UltimateDonutSmp plugin.\n\n" > "$TARGET_FILE"
          fi

          HEADER=$(head -n 4 "$TARGET_FILE")
          REST=$(tail -n +5 "$TARGET_FILE")

          printf "%s\n\n%s\n\n%s\n" "$HEADER" "$CHANGELOG_BODY" "$REST" > "$TARGET_FILE"

      - name: Commit and Push Updated changelog.md to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md CHANGELOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes in changelog file to commit."
          else
            git commit -m "docs(changelog): update changelog for version ${{ steps.version_info.outputs.version }}"
            git push origin HEAD:main
          fi
