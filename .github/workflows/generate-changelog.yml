name: Generate Changelog Only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag/name for the changelog (e.g. 1.5-pre or 1.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Date
        id: version_info
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            INPUT_VER="${{ github.event.inputs.version_name }}"
          else
            INPUT_VER="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' if present (e.g. v1.5-pre -> 1.5-pre)
          VERSION="${INPUT_VER#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate and Update changelog.md
        env:
          VERSION: ${{ steps.version_info.outputs.version }}
          RELEASE_DATE: ${{ steps.version_info.outputs.date }}
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess

          version = os.environ.get("VERSION", "1.0")
          date = os.environ.get("RELEASE_DATE", "")

          print(f"Generating changelog for version={version}, date={date}")

          prev_tag = ""
          try:
              res = subprocess.run(["git", "describe", "--tags", "--abbrev=0", "HEAD^"], capture_output=True, text=True)
              prev_tag = res.stdout.strip()
          except Exception:
              pass

          if prev_tag:
              print(f"Comparing against previous tag: {prev_tag}")
              cmd = ["git", "log", "--pretty=format:- %s (%h)", f"{prev_tag}..HEAD"]
          else:
              print("No previous tag found. Fetching recent 30 commits.")
              cmd = ["git", "log", "--pretty=format:- %s (%h)", "-n", "30"]

          log_res = subprocess.run(cmd, capture_output=True, text=True)
          lines = [l.strip() for l in log_res.stdout.splitlines() if l.strip()]

          if not lines:
              lines = [f"- Release build for {version} ({date})"]

          changelog_entry = f"## [{version}] - {date}\n\n" + "\n".join(lines)

          target_file = "changelog.md"

          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              
              header_lines = content.splitlines()[:4]
              rest_lines = content.splitlines()[4:]
              header_str = "\n".join(header_lines)
              rest_str = "\n".join(rest_lines)
              new_content = f"{header_str.strip()}\n\n{changelog_entry}\n\n{rest_str.strip()}\n"
          else:
              header_str = "# Changelog - UltimateDonutSmp\n\nAll notable changes and behavioral modifications for the UltimateDonutSmp plugin."
              new_content = f"{header_str}\n\n{changelog_entry}\n"

          with open(target_file, "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Successfully written {target_file}!")
          EOF

      - name: Commit and Push Updated changelog.md to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md CHANGELOG.md 2>/dev/null || true
          
          git status
          
          if git diff --staged --quiet; then
            echo "::warning ::No changes in changelog file to commit."
          else
            git commit -m "docs(changelog): update changelog for version ${{ steps.version_info.outputs.version }}"
            git push origin HEAD:main
            echo "Successfully pushed updated changelog to main branch!"
          fi
