name: Create Draft Release & Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag/name for the release (e.g. 1.5-pre or 1.4.1)'
        required: true
        type: string
      since_date:
        description: 'Fetch commits since date (e.g. 2026-08-03 or Aug 3, 2026)'
        required: false
        type: string
        default: ''
      since_commit:
        description: 'Fetch commits since Commit ID or URL (e.g. c984801c...)'
        required: false
        type: string
        default: '572ee9abd1b717bcff78a424dfb00da077b710ea'
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version & Tag Info
        id: info
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            INPUT_VER="${{ github.event.inputs.version_name }}"
          else
            INPUT_VER="${GITHUB_REF_NAME}"
          fi

          if [[ "$INPUT_VER" == v* ]]; then
            TAG_NAME="$INPUT_VER"
            VERSION="${INPUT_VER#v}"
          else
            TAG_NAME="v$INPUT_VER"
            VERSION="$INPUT_VER"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "${{ github.event.inputs.is_prerelease }}" == "true" ]] || [[ "$TAG_NAME" =~ -(pre|alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Structured Plugin Changelog Body
        id: changelog_gen
        env:
          VERSION: ${{ steps.info.outputs.version }}
          TAG_NAME: ${{ steps.info.outputs.tag_name }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          SINCE_COMMIT: ${{ github.event.inputs.since_commit }}
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess, re

          version = os.environ.get("VERSION", "1.0")
          tag_name = os.environ.get("TAG_NAME", "v1.0")
          since_date = os.environ.get("SINCE_DATE", "").strip()
          since_commit = os.environ.get("SINCE_COMMIT", "").strip()

          # Sanitize commit hash or full GitHub commit URL
          if since_commit:
              match = re.search(r'([0-9a-f]{7,40})', since_commit, re.IGNORECASE)
              if match:
                  since_commit = match.group(1)

          if since_date:
              print(f"Fetching plugin commits since date: '{since_date}'...")
              cmd = ["git", "log", "--pretty=format:%s", f"--since={since_date}", "--", "src/", "pom.xml"]
          elif since_commit:
              print(f"Fetching plugin commits since commit ID: '{since_commit}'...")
              cmd = ["git", "log", "--pretty=format:%s", f"{since_commit}..HEAD", "--", "src/", "pom.xml"]
          else:
              print("No since_date or since_commit provided. Using default since date: '2026-08-03'...")
              cmd = ["git", "log", "--pretty=format:%s", "--since=2026-08-03", "--", "src/", "pom.xml"]

          log_res = subprocess.run(cmd, capture_output=True, text=True)
          commits = [line.strip() for line in log_res.stdout.splitlines() if line.strip()]

          # Fallback if command produced 0 commits
          if not commits:
              print("Fallback: checking commits from previous release tag...")
              tags_res = subprocess.run(["git", "tag", "-l", "v[0-9]*.[0-9]*"], capture_output=True, text=True)
              official_tags = [t.strip() for t in tags_res.stdout.splitlines() if t.strip()]
              prev_official = [t for t in official_tags if t != tag_name and not any(p in t for p in ["-pre", "-rc", "-beta", "-alpha"])]
              prev_tag = prev_official[-1] if prev_official else "v1.4.1"
              cmd = ["git", "log", "--pretty=format:%s", f"{prev_tag}..HEAD", "--", "src/", "pom.xml"]
              log_res = subprocess.run(cmd, capture_output=True, text=True)
              commits = [line.strip() for line in log_res.stdout.splitlines() if line.strip()]

          added_items = []
          fixed_items = []
          changed_items = []

          ignored_keywords = [
              "rebuilt the jar", "rebuilt jar", "bump version", "ci:", "docs(changelog):",
              "generate-changelog", "delete note.md", "merge pull request", "merge branch"
          ]

          def clean_description(desc):
              # Rule 3: Strip bold feature prefixes e.g. **Amethyst Tools:** or **Combat:**
              desc = re.sub(r'^\*\*[^*]+\*\*:\s*', '', desc)
              desc = re.sub(r'^\*\*[^*]+\*\*\s*', '', desc)
              # Strip conventional git scope prefixes e.g. fix(combat): or feat(gui):
              desc = re.sub(r'^(feat|fix|perf|refactor|style|chore|docs)\([^)]+\):\s*', '', desc, flags=re.IGNORECASE)
              desc = re.sub(r'^(feat|fix|perf|refactor|style|chore|docs):\s*', '', desc, flags=re.IGNORECASE)
              # Strip trailing issue numbers e.g. (#44)
              desc = re.sub(r'\s*\(\s*#\d+\s*\)', '', desc)
              desc = desc.strip()
              if desc and len(desc) > 0:
                  desc = desc[0].upper() + desc[1:]
              return desc

          for commit in commits:
              commit_lower = commit.lower()
              if any(k in commit_lower for k in ignored_keywords):
                  continue
              
              cleaned = clean_description(commit)
              if not cleaned:
                  continue
              
              # Rule 2: Categorize into Added, Fixed, Changed / Improved
              if re.match(r'^(feat|add|added)', commit, re.IGNORECASE):
                  added_items.append(cleaned)
              elif re.match(r'^(fix|fixing|fixed|resolved)', commit, re.IGNORECASE):
                  fixed_items.append(cleaned)
              elif re.match(r'^(perf|optimize|optimizing|normalize|normalizing|update|updating|refactor|improved|improve)', commit, re.IGNORECASE):
                  changed_items.append(cleaned)
              else:
                  if "fix" in commit_lower or "bug" in commit_lower or "issue" in commit_lower:
                      fixed_items.append(cleaned)
                  elif "add" in commit_lower or "new" in commit_lower or "feature" in commit_lower:
                      added_items.append(cleaned)
                  else:
                      changed_items.append(cleaned)

          changelog_sections = []

          if added_items:
              unique_added = list(dict.fromkeys(added_items))
              changelog_sections.append("### Added\n" + "\n".join(f"- {item}" for item in unique_added))

          if fixed_items:
              unique_fixed = list(dict.fromkeys(fixed_items))
              changelog_sections.append("### Fixed\n" + "\n".join(f"- {item}" for item in unique_fixed))

          if changed_items:
              unique_changed = list(dict.fromkeys(changed_items))
              changelog_sections.append("### Changed / Improved\n" + "\n".join(f"- {item}" for item in unique_changed))

          if not changelog_sections:
              changelog_sections.append("### Changed / Improved\n- General plugin stability and behavioral optimizations.")

          full_changelog = "\n\n".join(changelog_sections)

          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a', encoding='utf-8') as f:
                  f.write("changelog_body<<EOF_CHANGELOG_MARKER\n")
                  f.write(full_changelog + "\n")
                  f.write("EOF_CHANGELOG_MARKER\n")
          EOF

      - name: Create Draft Release on GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "UltimateDonutSMP ${{ steps.info.outputs.tag_name }}"
          body: ${{ steps.changelog_gen.outputs.changelog_body }}
          draft: true
          prerelease: ${{ steps.info.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
