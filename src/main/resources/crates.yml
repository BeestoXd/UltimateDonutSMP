# SMPCore setup: Crate opening behavior and editable crate reward definitions.
# SMPCore setup: Keep indentation with spaces; reload with /smpcore reload when the setting supports reload.

SETTINGS:
  LIST-MENU:
    TITLE: '&8Crates'
    SIZE: 27
    FILLER: GRAY_STAINED_GLASS_PANE
    CONTENT-SLOTS:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    EMPTY-SLOT: 13
    EMPTY:
      MATERIAL: BARRIER
      DISPLAY-NAME: '&cNo Crates'
      LORE:
      - '&7No crates are available right now.'
    CLOSE-BUTTON:
      SLOT: 26
      MATERIAL: BARRIER
      DISPLAY-NAME: '&cClose'
      LORE:
      - '&7Close this menu.'
  
  CONFIRM-MENU:
    SIZE: 27
    FILLER: GRAY_STAINED_GLASS_PANE
    PREVIEW-SLOT: 13
    CONFIRM-SLOT: 15
    CONFIRM-BUTTON:
      MATERIAL: LIME_STAINED_GLASS_PANE
      DISPLAY-NAME: '&aConfirm'
      LORE:
      - '&7Claim &f{reward}&7 from'
      - '&b{crate}&7.'
    CANCEL-BUTTON:
      SLOT: 11
      MATERIAL: RED_STAINED_GLASS_PANE
      DISPLAY-NAME: '&cCancel'
      LORE:
      - '&7Return to the reward list.'
  
  HOLOGRAM:
    OFFSET-Y: 1.6
    LINES:
    - '{crate}'
    - '&7Right-click to open'
    KEY-LINE: '&7Keys: &f{keys}'
  
  PARTICLES:
    ENABLED: true
    TYPE: ENCHANT
    COUNT: 4
  
  GACHA:
    TITLE: '&8Rolling Reward'
    FILLER: BLACK_STAINED_GLASS_PANE
    PREVIEW-SLOTS:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    POINTER-SLOT: 13
    TOTAL-STEPS: 38
    TICK-INTERVAL: 2

